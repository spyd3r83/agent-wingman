name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify release candidate
        run: bun run verify

  opencode-compatibility:
    name: OpenCode ${{ matrix.label }} (${{ matrix.version }})
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: minimum
            version: 1.3.5
          - label: midpoint
            version: 1.14.17
          - label: latest
            version: latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked development dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build version-neutral plugin
        run: bun run build

      - name: Install isolated OpenCode runtime
        env:
          OPENCODE_VERSION: ${{ matrix.version }}
        run: |
          npm --cache "$RUNNER_TEMP/npm-cache" install \
            --prefix "$RUNNER_TEMP/opencode" \
            --ignore-scripts --no-audit --no-fund \
            "opencode-ai@$OPENCODE_VERSION"
          echo "OPENCODE_BIN=$RUNNER_TEMP/opencode/node_modules/opencode-linux-x64/bin/opencode" >> "$GITHUB_ENV"

      - name: Load plugin through OpenCode
        env:
          OPENCODE_VERSION: ${{ matrix.version }}
        run: bun run scripts/opencode-smoke.ts
